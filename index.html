<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b3aba4">
  <title>小虎斑</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="companion">
    <section class="scene" aria-label="小虎斑互动区">
      <div class="portrait" id="portrait">
        <img class="poster" src="./assets/video/poster.jpg" alt="正面坐着的银灰色虎斑猫" fetchpriority="high">
        <canvas id="catCanvas" width="720" height="1280" role="img" aria-label="跟随手机倾斜转头的小虎斑"></canvas>
        <button class="touch-surface" id="touchSurface" aria-label="按住拖动控制小猫视线，轻触摸摸它" disabled></button>
      </div>
      <span class="sr-only" id="mood" role="status">正在准备小猫…</span>
      <button class="start-button" id="startButton" hidden>点一下，让它动起来</button>
    </section>
    <footer class="controls">
      <p class="hint" id="hint" aria-live="polite">轻轻倾斜手机，让它看向你。</p>
      <div class="control-row">
        <button class="motion-button" id="motionButton" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="3" width="10" height="18" rx="2" transform="rotate(14 12 12)"/><path d="m2 8 2-3 1 4m17 7-2 3-1-4"/></svg><span>开启倾斜</span></button>
        <button class="round-button" id="settingsButton" aria-label="互动设置" title="互动设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 17h14M9 4v6M15 14v6"/></svg></button>
      </div>
    </footer>
  </main>
  <dialog id="settings">
    <form method="dialog" class="dialog-header"><h2>互动设置</h2><button class="round-button" aria-label="关闭设置">×</button></form>
    <div class="setting-row"><div><strong>重新校准手机</strong><p>用舒服的姿势握住手机，再点校准。</p></div><button id="calibrateButton" class="small-button">校准</button></div>
    <p class="settings-status" id="settingsStatus" role="status">仅使用运动与方向感应，不访问摄像头。手机感应需要 HTTPS。</p>
    <div class="play-actions"><button class="small-button" id="petButton" disabled>摸摸它</button><button class="small-button" id="sleepButton" disabled>打个盹</button><button class="small-button" id="pauseButton" aria-pressed="false">暂停</button></div>
    <label class="setting-row"><div><strong>自动打盹</strong><p>没有互动约 30 秒时打个盹。</p></div><input id="autoSleep" type="checkbox" checked></label>
    <label class="setting-row"><div><strong>减少动态效果</strong><p>暂停自动播放，保留主动互动。</p></div><input id="reduceMotion" type="checkbox"></label>
    <details><summary>其他操作</summary><p>也可以按住小猫拖动，轻触摸摸它。键盘方向键控制视线，回车互动，Home 回正。</p><p>已有视频角度互动，不是可任意旋转的 3D 模型。</p></details>
    <p class="settings-foot"><span id="inputLabel">触摸互动</span> · 9:16</p>
  </dialog>
  <div id="mediaBank" aria-hidden="true"></div>
  <noscript>请启用 JavaScript 来与小猫互动。</noscript>
  <script type="module" src="./app.js"></script>
</body>
</html>
